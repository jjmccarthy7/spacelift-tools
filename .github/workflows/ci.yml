name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    name: Type check, build, and content guardrail
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/hellospacelift/package-lock.json

      - name: Install dependencies
        working-directory: apps/hellospacelift
        run: npm ci

      # lint step omitted: eslint and eslint-config-next are not in devDependencies,
      # so `next lint` would fail in CI. To enable: add eslint + eslint-config-next
      # to devDependencies and uncomment the step below.
      #
      # - name: Lint
      #   working-directory: apps/hellospacelift
      #   run: npm run lint

      - name: TypeScript type check
        working-directory: apps/hellospacelift
        run: npx tsc --noEmit

      - name: Build
        working-directory: apps/hellospacelift
        run: npm run build

      - name: Content guardrail
        run: bash scripts/check-content.sh
